name: ci
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_cache:
        description: >-
          Build the weeder job from scratch. Use this when the cached build tree
          holds HIE files for modules that a component no longer compiles, which
          makes weeder report code that is gone.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout 🛎️
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - name: Install Nix ❄
      uses: cachix/install-nix-action@616559265b40713947b9c190a8ff4b507b5df49b # v31

    - name: Cache Nix store 📦
      uses: DeterminateSystems/magic-nix-cache-action@87b14cf437d03d37989d87f0fa5ce4f5dc1a330b # v8

    - name: Link Cachix 🔌
      uses: cachix/cachix-action@ad2ddac53f961de1989924296a1f236fcfbaa4fc # v15
      with:
        name: kpbj-fm
        authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
        pushFilter: '(-kpbj-web|-sync-host-emails|-token-cleanup|-lucid-|-web-server-core)'

    - name: Build 🔨
      run: nix build

    - name: Build NixOS closure for staging 🏗️
      if: github.ref == 'refs/heads/main'
      run: nix build .#nixosConfigurations.kpbj-staging.config.system.build.toplevel

  # Weeder needs .hie files, which only a cabal build produces. `nix build`
  # does not write them, so this job builds through cabal and caches the build
  # tree. The report is advisory: scripts/weeder.sh exits 0 when it finds
  # something, and the findings go to the job summary.
  weeder:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Nix ❄
        uses: cachix/install-nix-action@616559265b40713947b9c190a8ff4b507b5df49b # v31

      - name: Cache Nix store 📦
        uses: DeterminateSystems/magic-nix-cache-action@87b14cf437d03d37989d87f0fa5ce4f5dc1a330b # v8

      # Cachix holds nix store paths and not cabal artifacts, so the first run
      # compiles every dependency from source. Restore and save are separate
      # steps because the combined action saves nothing when the job fails, and
      # a cold build that hits the timeout would then start cold again forever.
      # The save runs on failure as well, so each run keeps what it built.
      #
      # The restore keys let a run start from an older tree. A tree built by
      # another GHC is safe, because scripts/weeder.sh reads the current build
      # plan and ignores everything outside it.
      - name: Restore cabal store and build tree 📦
        id: cabal-cache
        if: ${{ ! inputs.skip_cache }}
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cabal
            ~/.cache/cabal
            ~/.local/state/cabal
            dist-newstyle
          key: weeder-${{ runner.os }}-${{ hashFiles('flake.lock', 'cabal.project', '**/*.cabal') }}
          restore-keys: |
            weeder-${{ runner.os }}-

      - name: Build with IDE info 🔨
        run: |
          nix develop --command cabal update
          nix develop --command cabal build all --enable-tests

      - name: Save cabal store and build tree 📦
        if: always() && steps.cabal-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cabal
            ~/.cache/cabal
            ~/.local/state/cabal
            dist-newstyle
          key: weeder-${{ runner.os }}-${{ hashFiles('flake.lock', 'cabal.project', '**/*.cabal') }}

      - name: Check for dead code 🧹
        run: |
          nix develop --command ./scripts/weeder.sh | tee /tmp/weeder.txt
          {
            echo '## Weeder report'
            echo
            echo '```'
            cat /tmp/weeder.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Nix ❄
        uses: cachix/install-nix-action@616559265b40713947b9c190a8ff4b507b5df49b # v31

      - name: Cache Nix store 📦
        uses: DeterminateSystems/magic-nix-cache-action@87b14cf437d03d37989d87f0fa5ce4f5dc1a330b # v8

      - name: Link Cachix 🔌
        uses: cachix/cachix-action@ad2ddac53f961de1989924296a1f236fcfbaa4fc # v15
        with:
          name: kpbj-fm
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
          pushFilter: '(-kpbj-web|-sync-host-emails|-token-cleanup|-lucid-|-web-server-core)'

      # The flake's packages are built with dontCheck, so the suites do not run
      # during `nix build`. The checks outputs turn them back on. Each suite
      # starts its own Postgres, so no service container is needed here.
      - name: Run test suites 🧪
        run: |
          nix build -L --keep-going --no-link \
            .#checks.x86_64-linux.kpbj-database \
            .#checks.x86_64-linux.kpbj-web \
            .#checks.x86_64-linux.stripe-http \
            .#checks.x86_64-linux.easypost-http \
            .#checks.x86_64-linux.mailchimp-http \
            .#checks.x86_64-linux.sync-host-emails

  e2e:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: dev_db
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Nix
        uses: cachix/install-nix-action@616559265b40713947b9c190a8ff4b507b5df49b # v31

      - name: Cache Nix store
        uses: DeterminateSystems/magic-nix-cache-action@87b14cf437d03d37989d87f0fa5ce4f5dc1a330b # v8

      - name: Link Cachix
        uses: cachix/cachix-action@ad2ddac53f961de1989924296a1f236fcfbaa4fc # v15
        with:
          name: kpbj-fm
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
          pushFilter: '(-kpbj-web|-sync-host-emails|-token-cleanup|-lucid-|-web-server-core)'

      - name: Build web server
        run: nix build

      - name: Run migrations
        run: |
          nix develop --command sqlx migrate run --source services/web/migrations
        env:
          DATABASE_URL: postgres://postgres@localhost:5433/dev_db

      - name: Load mock data
        run: |
          nix develop --command psql -h localhost -p 5433 -U postgres -d dev_db --set ON_ERROR_STOP=on -f load-all.sql
        working-directory: services/web/mock-data

      - name: Start web server
        run: |
          ./result/bin/kpbj-web > /tmp/kpbj-server.log 2>&1 &
          echo $! > /tmp/kpbj-server.pid
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4000 > /dev/null 2>&1; then
              echo "Server is ready"
              exit 0
            fi
            sleep 2
          done
          echo "::error::Server failed to start within 60s"
          cat /tmp/kpbj-server.log
          exit 1
        env:
          APP_ENVIRONMENT: Development
          APP_WARP_PORT: "4000"
          APP_HOSTNAME: localhost:4000
          APP_POSTGRES_CONNECTION_STRING: "postgres://postgres:postgres@localhost:5433/dev_db"
          APP_LOCAL_STORAGE_ROOT: /tmp/kpbj
          STREAM_URL: http://localhost:8000/stream
          METADATA_URL: http://localhost:8000/status-json.xsl

      - name: Run E2E tests
        run: nix develop --command playwright test
        working-directory: e2e
        env:
          CI: "true"

      - name: Print server logs on failure
        if: ${{ failure() }}
        run: cat /tmp/kpbj-server.log

      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 14
