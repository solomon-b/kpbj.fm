name: ci
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_cache:
        description: >-
          Build the weeder job from scratch. Use this when the cached build tree
          holds HIE files for modules that a component no longer compiles, which
          makes weeder report code that is gone. scripts/weeder.sh removes the
          HIE file of a module whose source file is gone, so this is only for a
          module that left other-modules while its source file stayed.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout 🛎️
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    # Since 2026-10-22 the hosted runners run out of disk during the Nix and
    # cabal builds, and the runner then fails to write its own log. Each job
    # deletes the preinstalled toolchains that this repo does not use. The
    # df lines show the free space in the job log.
    - name: Free disk space 🧹
      run: |
        df -h /
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        df -h /

    - name: Install Nix ❄
      uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31

    - name: Cache Nix store 📦
      uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15

    - name: Link Cachix 🔌
      uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
      with:
        name: kpbj-fm
        authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'

    - name: Build 🔨
      run: nix build

    - name: Build NixOS closure for staging 🏗️
      if: github.ref == 'refs/heads/main'
      run: nix build .#nixosConfigurations.kpbj-staging.config.system.build.toplevel

  # Weeder needs .hie files, which only a cabal build produces. `nix build`
  # does not write them, so this job builds through cabal and caches the build
  # tree. The report is advisory: scripts/weeder.sh exits 0 when it finds
  # something, and the findings go to the job summary.
  weeder:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # See the note in the build job.
      - name: Free disk space 🧹
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install Nix ❄
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31

      - name: Cache Nix store 📦
        uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15

      # Cachix holds nix store paths and not cabal artifacts, so the first run
      # compiles every local package from source. Restore and save are separate
      # steps because the combined action saves nothing when the job fails, and
      # a cold build that hits the timeout would then start cold again forever.
      # The save runs on failure as well, so each run keeps what it built.
      #
      # The restore keys let a run start from an older tree. A tree built by
      # another GHC is safe, because scripts/weeder.sh reads the current build
      # plan and ignores everything outside it.
      - name: Restore cabal store and build tree 📦
        id: cabal-cache
        if: ${{ ! inputs.skip_cache }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cabal
            ~/.cache/cabal
            ~/.local/state/cabal
            dist-newstyle
          key: weeder-${{ runner.os }}-${{ hashFiles('flake.lock', 'cabal.project', '**/*.cabal') }}
          restore-keys: |
            weeder-${{ runner.os }}-

      - name: Build with IDE info 🔨
        run: |
          nix develop --command cabal update
          nix develop --command cabal build all --enable-tests

      - name: Save cabal store and build tree 📦
        if: always() && steps.cabal-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cabal
            ~/.cache/cabal
            ~/.local/state/cabal
            dist-newstyle
          key: weeder-${{ runner.os }}-${{ hashFiles('flake.lock', 'cabal.project', '**/*.cabal') }}

      - name: Check for dead code 🧹
        run: |
          nix develop --command ./scripts/weeder.sh | tee /tmp/weeder.txt
          {
            echo '## Weeder report'
            echo
            echo '```'
            cat /tmp/weeder.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # See the note in the build job.
      - name: Free disk space 🧹
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install Nix ❄
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31

      - name: Cache Nix store 📦
        uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15

      - name: Link Cachix 🔌
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: kpbj-fm
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'

      # The flake's packages are built with dontCheck, so the suites do not run
      # during `nix build`. The checks outputs turn them back on. Each suite
      # starts its own Postgres, so no service container is needed here.
      - name: Run test suites 🧪
        run: |
          nix build -L --keep-going --no-link \
            .#checks.x86_64-linux.kpbj-database \
            .#checks.x86_64-linux.kpbj-storage \
            .#checks.x86_64-linux.kpbj-web \
            .#checks.x86_64-linux.stripe-http \
            .#checks.x86_64-linux.easypost-http \
            .#checks.x86_64-linux.mailchimp-http \
            .#checks.x86_64-linux.google-service-account \
            .#checks.x86_64-linux.sync-host-emails \
            .#checks.x86_64-linux.sync-schedule-calendar

  e2e:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: dev_db
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # See the note in the build job.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31

      - name: Cache Nix store
        uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15

      - name: Link Cachix
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: kpbj-fm
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'

      - name: Build web server
        run: nix build

      - name: Run migrations
        run: |
          nix develop --command sqlx migrate run --source services/web/migrations
        env:
          DATABASE_URL: postgres://postgres@localhost:5433/dev_db

      - name: Load mock data
        run: |
          nix develop --command psql -h localhost -p 5433 -U postgres -d dev_db --set ON_ERROR_STOP=on -f load-all.sql
        working-directory: services/web/mock-data

      - name: Start web server
        run: |
          ./result/bin/kpbj-web > /tmp/kpbj-server.log 2>&1 &
          echo $! > /tmp/kpbj-server.pid
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4000 > /dev/null 2>&1; then
              echo "Server is ready"
              exit 0
            fi
            sleep 2
          done
          echo "::error::Server failed to start within 60s"
          cat /tmp/kpbj-server.log
          exit 1
        env:
          APP_ENVIRONMENT: Development
          APP_WARP_PORT: "4000"
          APP_HOSTNAME: localhost:4000
          APP_POSTGRES_CONNECTION_STRING: "postgres://postgres:postgres@localhost:5433/dev_db"
          APP_LOCAL_STORAGE_ROOT: /tmp/kpbj
          STREAM_URL: http://localhost:8000/stream
          METADATA_URL: http://localhost:8000/status-json.xsl

      - name: Make E2E audio fixtures
        run: nix develop --command just e2e-fixtures

      - name: Run E2E tests
        run: nix develop --command playwright test
        working-directory: e2e
        env:
          CI: "true"

      - name: Print server logs on failure
        if: ${{ failure() }}
        run: cat /tmp/kpbj-server.log

      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 14
