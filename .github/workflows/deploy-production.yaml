name: Deploy to Production

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag to deploy (e.g., v0.3.2)'
        required: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Validate release tag
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          if ! echo "$TAG" | grep -qP '^v\d+\.\d+\.\d+$'; then
            echo "ERROR: '$TAG' is not a valid release tag (expected v{major}.{minor}.{patch})"
            exit 1
          fi
          if ! git tag --list | grep -qx "$TAG"; then
            echo "ERROR: Tag '$TAG' does not exist"
            exit 1
          fi

      # The deploy builds the NixOS system on the hosted runner, so it runs out
      # of disk like the CI jobs. See the note in the build job of nix.yaml.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31

      - name: Cache Nix store
        uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15

      - name: Setup Cachix
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: kpbj-fm
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.PRODUCTION_KNOWN_HOST }}" >> ~/.ssh/known_hosts

      - name: Pre-deploy database backup
        run: |
          ssh root@ssh.kpbj.fm \
            'sudo -u postgres bash -c "set -a; . /run/secrets/rendered/kpbj-pgbackrest-s3.env; pgbackrest backup --stanza=kpbj --type=full --repo=1"'
          ssh root@ssh.kpbj.fm \
            'sudo -u postgres bash -c "set -a; . /run/secrets/rendered/kpbj-pgbackrest-s3.env; pgbackrest backup --stanza=kpbj --type=full --repo=2"' \
            || echo '::warning::S3 backup (repo2) failed — continuing with deploy'

      - name: Deploy NixOS configuration
        run: |
          nix shell nixpkgs#nixos-rebuild -c \
            nixos-rebuild switch \
            --flake .#kpbj-prod \
            --target-host root@ssh.kpbj.fm
