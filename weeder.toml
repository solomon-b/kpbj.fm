# Weeder Configuration
# https://github.com/ocharles/weeder
#
# Run this through `just weeder`, which calls scripts/weeder.sh. That script
# reads the cabal build plan and points weeder at every local component, so
# one analysis covers all 17 packages at once. A symbol that any package in
# the monorepo uses counts as live. An export reported here is reachable from
# nothing that ships.
#
# Weeder needs .hie files. Every component sets -fwrite-ide-info in its
# ghc-options. If you add a package, add the flag as well, or weeder reports
# nothing for it and says so.

# Entry points.
# Every executable and every test suite has its own Main.main, and all of them
# are visible, so the real entry points anchor the graph. The Servant tree
# hangs off the kpbj-web executable and needs no help. Test modules hang off
# the Spec.hs that hspec-discover writes.
roots = [
  "^Main\\.main$",
  # Cabal writes a Paths_ module per package and nothing imports most of them.
  "^Paths_.*"
]

# Modules where every export counts as a root.
#
# Each one is an API surface rather than application code. The question weeder
# answers, "does anything in this repo call it", is the wrong question for
# these, because the answer says nothing about whether they should exist. An
# export that kpbj-web does not call yet is not dead code here.
#
# Application code belongs nowhere in this list. kpbj-web, kpbj-database,
# kpbj-types, and kpbj-email are consumed only by this repo, so weeder's
# question is exactly the right one for them.
root-modules = [
  # The three Lucid libraries under services/web/lib are written to stand
  # alone and are meant to leave this repo.
  "^Lucid\\.HTMX$",
  "^Lucid\\.Alpine$",
  "^Lucid\\.HTML5\\.Extra$",
  "^Lucid\\.Form\\.Builder.*$",
  "^Lucid\\.Tailwind$",
  # The design system vocabulary. It is deliberately wider than the set of
  # tokens and combinators any one page happens to use.
  "^Design\\.Tokens$",
  "^Design\\.StyleBuilder$",
  # The property test assertion DSL. Its operators come in families, and a
  # family is worth keeping whole even when one member has no call site.
  "^Test\\.Database\\.Property\\.Assert$",
  # Client libraries for somebody else's HTTP API. Each is measured against
  # the vendor's API surface, not against what this repo happens to call.
  "^Stripe\\..*$",
  "^EasyPost\\..*$",
  "^Mailchimp\\..*$"
]

# Treat every type class instance as a root.
# Setting this to false also reports unused instances. That produces 224
# findings here, nearly all of them derived instances that no call site names.
# The noise buries the rest of the report.
type-class-roots = true

# Report types that nothing outside their own module names.
unused-types = true
